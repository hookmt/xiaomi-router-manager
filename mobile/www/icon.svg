<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Tło ikony zaokrąglone -->
  <rect width="512" height="512" rx="112" fill="url(#gradBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="8"/>
  
  <!-- Fale Wi-Fi (górna część) -->
  <path d="M 128 180 A 160 160 0 0 1 384 180" fill="none" stroke="url(#gradCyan)" stroke-width="24" stroke-linecap="round"/>
  <path d="M 176 228 A 100 100 0 0 1 336 228" fill="none" stroke="url(#gradCyan)" stroke-width="24" stroke-linecap="round" opacity="0.85"/>
  <circle cx="256" cy="272" r="16" fill="url(#gradGreen)"/>
  
  <!-- Obudowa routera BE7000 (dolna część) -->
  <rect x="96" y="320" width="320" height="96" rx="20" fill="#1e2430" stroke="#475569" stroke-width="6"/>
  <!-- Diody statusu LED -->
  <circle cx="140" cy="368" r="8" fill="#22c55e"/>
  <circle cx="170" cy="368" r="8" fill="#38bdf8"/>
  <circle cx="200" cy="368" r="8" fill="#38bdf8"/>
  <!-- Paski wentylacyjne -->
  <rect x="250" y="362" width="130" height="12" rx="6" fill="#334155"/>
</svg>
