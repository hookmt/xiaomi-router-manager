plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hookmt.xrm'
    compileSdk 34

    defaultConfig {
        applicationId "com.hookmt.xrm"
        minSdk 24
        targetSdk 34
        versionCode 108
        versionName "1.0.8"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath != null && !ksPath.isEmpty() && file(ksPath).exists()) {
                storeFile file(ksPath)
                storeType "PKCS12"
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            buildConfigField 'boolean', 'PREVIEW_READ_ONLY', 'false'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            signingConfig (ksPath != null && !ksPath.isEmpty() && file(ksPath).exists() ? signingConfigs.release : signingConfigs.debug)
        }
        debug {
            buildConfigField 'boolean', 'PREVIEW_READ_ONLY', 'false'
            applicationIdSuffix ".debug"
            debuggable false
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../www']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
