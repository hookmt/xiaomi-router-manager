name: Build and Release XRM

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Android Release APK
        run: |
          cd mobile/android
          gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          find mobile/android/app/build/outputs/apk/ -name "*.apk" -not -name "*androidTest*" | head -n 1 | xargs -I {} cp {} Xiaomi_Router_Manager_v1.0.6.apk
          ls -lh Xiaomi_Router_Manager_v1.0.6.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi_Router_Manager_v1.0.6.apk
          path: Xiaomi_Router_Manager_v1.0.6.apk
          retention-days: 14

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter requests pyinstaller

      - name: Build Windows Executable with PyInstaller
        run: |
          pyinstaller Xiaomi_Router_Manager_v1.0.6.spec

      - name: Prepare EXE Asset
        run: |
          Copy-Item "dist\Xiaomi_Router_Manager_v1.0.6.exe" -Destination "Xiaomi_Router_Manager_v1.0.6.exe"
          Get-Item "Xiaomi_Router_Manager_v1.0.6.exe" | Format-List Length, Name

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi_Router_Manager_v1.0.6.exe
          path: Xiaomi_Router_Manager_v1.0.6.exe
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Xiaomi_Router_Manager_v1.0.6.apk

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: Xiaomi_Router_Manager_v1.0.6.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Xiaomi_Router_Manager_v1.0.6.exe
            Xiaomi_Router_Manager_v1.0.6.apk
          body_path: release_notes_v1.0.6.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
